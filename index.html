<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4B3FD1">
<title>なかよし板 見どころ帳</title>
<script>try{var d=JSON.parse(localStorage.getItem('nkd-disp')||'{}'),r=document.documentElement;if(d.fs)r.style.setProperty('--fsu',d.fs);if(d.bg&&d.bg!=='auto')r.setAttribute('data-theme',d.bg);if(d.strong)r.setAttribute('data-strong','');}catch(e){}</script>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --sunk:#E3E6EE; --ink:#171A23; --muted:#5B6275; --faint:#8A90A1;
  --line:#D5D9E3; --accent:#4B3FD1; --accent-soft:#E6E3FB; --accent-ink:#3528B8;
  --h1:#F2C46B; --h2:#EE9A45; --h3:#E5683A; --h4:#D23A38; --heat-ink:#3A1A0E;
  --bar:#BCC2D2; --bar-hot:#E5683A;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  --f-disp:"Dela Gothic One","Zen Kaku Gothic New","Yu Gothic UI",Meiryo,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
  --top:0px;
  --fsb:1; --fsu:1; --fs:calc(var(--fsb) * var(--fsu));
  color-scheme:light;
}
/* スマホは少し大きめの文字から */
@media (max-width:759px){ :root{ --fsb:1.08; } }
/* 背景：「端末に合わせる」のときは、端末が暗い表示なら暗くする */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){ color-scheme:dark;
    --bg:#11131A; --surface:#191C25; --sunk:#222634; --ink:#E8EAF1; --muted:#A1A7B8; --faint:#737A8D;
    --line:#2C3140; --accent:#9A91FF; --accent-soft:#2A2752; --accent-ink:#C3BEFF;
    --bar:#3A4052; --bar-hot:#F0784A; --heat-ink:#1B0D06; }
}
:root[data-theme="white"]{ --bg:#FFFFFF; --surface:#F3F4F8; --sunk:#E6E8EF; --line:#DADDE6; }
:root[data-theme="sepia"]{ --bg:#EFE5CF; --surface:#FAF4E6; --sunk:#E4D6B8; --ink:#33281B; --muted:#62533D; --faint:#86765C;
  --line:#D6C6A3; --accent:#9B4C17; --accent-soft:#F1DDC3; --accent-ink:#7B390E; --bar:#CDBB98; }
:root[data-theme="dark"],:root[data-theme="black"]{ color-scheme:dark;
  --bg:#11131A; --surface:#191C25; --sunk:#222634; --ink:#E8EAF1; --muted:#A1A7B8; --faint:#737A8D;
  --line:#2C3140; --accent:#9A91FF; --accent-soft:#2A2752; --accent-ink:#C3BEFF;
  --bar:#3A4052; --bar-hot:#F0784A; --heat-ink:#1B0D06; }
:root[data-theme="black"]{ --bg:#000000; --surface:#101116; --sunk:#1C1E25; --line:#272A33; }
/* 文字をくっきり：うすい灰色の文字を濃くして、少し太くする */
:root[data-strong]{ --muted:color-mix(in srgb, var(--ink) 84%, var(--bg)); --faint:color-mix(in srgb, var(--ink) 70%, var(--bg)); }
:root[data-strong] body{font-weight:500}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(14px * var(--fs));line-height:1.55;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- 上の帯 ---- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-disp);font-weight:400;font-size:calc(18px * var(--fs));line-height:1.25;margin:0;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:0 12px;font-size:calc(12px * var(--fs));color:var(--muted)}
.stats b{color:var(--ink);font-weight:700}
.stats .warn b{color:var(--h3)}
.find{display:flex;align-items:center;gap:6px;flex:1 1 240px;min-width:0;max-width:440px;margin-left:auto}
.search{flex:1;width:0;min-width:0;font:inherit;font-size:calc(14px * var(--fs));padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.link{border:0;background:none;color:var(--accent-ink);cursor:pointer;padding:4px 2px;font-size:calc(13px * var(--fs));white-space:nowrap}
.notice{margin:0;padding:6px 14px;font-size:calc(12.5px * var(--fs));background:var(--sunk);border-bottom:1px solid var(--line)}
.notice[hidden]{display:none}
.tags{display:flex;gap:5px;overflow-x:auto;padding:6px 14px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tag{flex:0 0 auto;font-size:calc(12.5px * var(--fs));line-height:1;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.tag .n{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));color:var(--faint);margin-left:4px}
.tag[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

/* ---- 日付（せまい画面は横に並べる） ---- */
.chips{position:sticky;top:0;z-index:10;display:flex;gap:5px;overflow-x:auto;padding:7px 14px;padding-top:max(7px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
.chip{flex:0 0 auto;display:grid;justify-items:center;gap:2px;min-width:50px;padding:5px 7px 6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.chip .d{font-family:var(--f-mono);font-size:calc(12.5px * var(--fs));font-weight:600;line-height:1}
.chip .w{font-size:calc(10.5px * var(--fs));color:var(--muted);line-height:1}
.chip .hb{width:30px}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-current="true"] .w{color:#E9E6FF}
.hb{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.hb i{display:block;height:100%;background:var(--bar-hot)}
.chip[aria-current="true"] .hb{background:rgba(255,255,255,.3)}
.chip[aria-current="true"] .hb i{background:#fff}

/* ---- 日付（広い画面は左に一覧） ---- */
.layout{display:block}
.rail{display:none}
.ditem{display:grid;gap:2px;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:none;padding:7px 12px 8px 11px;cursor:pointer;border-bottom:1px solid var(--line)}
.ditem:hover{background:var(--surface)}
.ditem .dl{display:flex;align-items:center;gap:8px;font-size:calc(12px * var(--fs));color:var(--muted)}
.ditem .dl b{font-family:var(--f-mono);font-size:calc(13px * var(--fs));font-weight:600;color:var(--ink)}
.ditem .dl .hb{width:46px;margin-left:auto}
.ditem .dh{font-size:calc(12.5px * var(--fs));line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ditem .dh.none{color:var(--faint)}
.ditem[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}

main{padding:10px 14px 24px;min-width:0}

/* ---- 1日の見出し ---- */
.dhead{display:grid;gap:4px 18px;grid-template-columns:minmax(0,1fr);padding-bottom:8px}
.dmeta{display:flex;flex-wrap:wrap;gap:0 12px;font-size:calc(12.5px * var(--fs));color:var(--muted)}
.dmeta b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.dhead h2{font-family:var(--f-disp);font-weight:400;font-size:calc(clamp(19px,4.6vw,23px) * var(--fs));line-height:1.35;margin:0}
.dhead h2.none{font-family:var(--f-body);font-size:calc(15px * var(--fs));font-weight:500;color:var(--muted)}
.dnote{margin:0;font-size:calc(12px * var(--fs));color:var(--muted)}
.spark svg{display:block;width:100%;height:36px}
.spark .ax{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:calc(10px * var(--fs));color:var(--faint);line-height:1.2}

/* ---- 区切りの見出し ---- */
.sec{margin-top:12px}
.sh{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;font-size:calc(13px * var(--fs));font-weight:700}
.sh .c{font-weight:400;font-size:calc(12px * var(--fs));color:var(--muted)}
.sh .link{margin-left:auto}

/* ---- 勢いの色 ---- */
.l1{--heat:var(--h1)}.l2{--heat:var(--h2)}.l3{--heat:var(--h3)}.l4{--heat:var(--h4)}
.heat{font-family:var(--f-mono);font-size:calc(11px * var(--fs));font-weight:600;line-height:1;padding:3px 5px;border-radius:5px;background:var(--heat);color:var(--heat-ink);white-space:nowrap}
.heat small{font-size:calc(9.5px * var(--fs));font-weight:500;opacity:.8}
.l3 .heat,.heat.l3,.l4 .heat,.heat.l4{color:#fff}
.tm{font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));color:var(--faint);margin-right:5px}

/* ---- 見どころ ---- */
.hlg{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.hl{background:var(--surface);border-left:3px solid var(--heat);border-radius:6px;padding:7px 10px 8px;display:grid;gap:2px;align-content:start}
.hl .ht{display:flex;align-items:center;gap:6px}
.hl .ht .tm{font-size:calc(12.5px * var(--fs));font-weight:600;color:var(--ink);margin:0}
.hl b{font-size:calc(14.5px * var(--fs));line-height:1.45}
.hl p{margin:0;font-size:calc(13.5px * var(--fs))}
.hl .hn{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:calc(11.5px * var(--fs));color:var(--accent-ink)}

/* ---- 時間帯ごと（番組表のように段組み） ---- */
.cols{display:block}
.win{background:var(--surface);border-left:3px solid var(--heat);border-radius:6px;margin:0 0 6px;padding:0 10px;break-inside:avoid}
.win summary{display:flex;align-items:center;gap:7px;padding:6px 0;cursor:pointer;list-style:none;min-width:0}
.win summary::-webkit-details-marker{display:none}
.win .wt{font-family:var(--f-mono);font-size:calc(13px * var(--fs));font-weight:600;flex:0 0 auto}
.win .heat{flex:0 0 auto}
.win .pv{flex:1;min-width:0;font-size:calc(12.5px * var(--fs));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win[open] .pv{display:none}
.win .n{margin-left:auto;font-size:calc(11px * var(--fs));color:var(--faint);flex:0 0 auto}
.tps{padding:0 0 7px}
.tp{margin:0;padding:2px 0;font-size:calc(13.5px * var(--fs));line-height:1.5}
.tp + .tp{border-top:1px dashed var(--line)}
.tp b{font-weight:700}
.tp .sm{color:var(--muted)}
.src{font-family:var(--f-mono);font-size:calc(11px * var(--fs));color:var(--faint)}
.src a{color:inherit}

/* ---- 告知・スレ ---- */
.ann{list-style:none;margin:0;padding:0;display:grid;gap:4px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.ann li{font-size:calc(13px * var(--fs));border-left:2px solid var(--line);padding-left:8px}
.ann .who{display:block;font-size:calc(11.5px * var(--fs));color:var(--muted)}
.thr{display:flex;flex-wrap:wrap;gap:5px}
.thr a{font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));padding:3px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);text-decoration:none}

/* ---- 検索 ---- */
.rh{font-size:calc(13px * var(--fs));color:var(--muted);margin:2px 0 10px}
.rh b{color:var(--ink)}
.grp{margin-bottom:14px}
.grp .gh{display:flex;align-items:baseline;gap:10px;margin-bottom:5px;font-size:calc(13px * var(--fs))}
.grp .gh b{font-family:var(--f-mono)}
.hit{background:var(--surface);border-left:3px solid var(--heat);border-radius:6px;padding:4px 10px;margin:0 0 5px;break-inside:avoid}
.hit .tp{border:0}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);font-size:calc(14px * var(--fs));padding:18px 0}

footer{padding:14px;font-size:calc(11.5px * var(--fs));color:var(--faint);display:grid;gap:2px;justify-items:start}
.setup{max-width:640px;display:grid;gap:10px;padding:8px 0 20px}
.setup h2{font-family:var(--f-disp);font-weight:400;font-size:calc(20px * var(--fs));margin:0}
.setup p,.setup ol{margin:0;font-size:calc(14px * var(--fs))}
.setup ol{padding-left:1.4em;display:grid;gap:4px}
.setup a{color:var(--accent-ink);font-weight:700}
.setup .row{display:flex;gap:8px}
.btn{border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;padding:7px 16px;cursor:pointer}
.setup .err{color:var(--h4);font-weight:700}
.setup .small{font-size:calc(12px * var(--fs));color:var(--muted)}
.tags:empty,.chips:empty{display:none}
/* ---- まとめ／伸びたレス の切り替え ---- */
.tabs{display:flex;gap:4px;margin:6px 0 2px;border-bottom:1px solid var(--line)}
.tabb{border:0;background:none;padding:7px 12px 8px;font-size:calc(14px * var(--fs));font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabb .c{font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));font-weight:600;margin-left:5px;color:var(--faint)}
.tabb[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabb[aria-selected="true"] .c{color:var(--accent-ink)}
/* ---- 伸びたレス ---- */
.hotbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:10px 0 8px;font-size:calc(13px * var(--fs))}
.hotbar .lbl{color:var(--muted)}
.hchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:calc(12.5px * var(--fs));cursor:pointer}
.hchip .c{font-family:var(--f-mono);font-size:calc(11px * var(--fs));color:var(--faint);margin-left:4px}
.hchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hchip[aria-pressed="true"] .c{color:#E9E6FF}
.hotbar .sp{flex:1}
.imgsw{display:inline-flex;align-items:center;gap:4px;color:var(--muted);cursor:pointer}
.hp{background:var(--surface);border-left:3px solid var(--heat);border-radius:6px;padding:8px 10px 8px;margin:0 0 8px;break-inside:avoid}
.hp .hh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:4px}
.hp .hh .tm{font-size:calc(12.5px * var(--fs));font-weight:600;color:var(--ink);margin:0}
.rc{font-size:calc(12px * var(--fs));font-weight:700;color:var(--heat-ink);background:var(--heat);border-radius:5px;padding:2px 6px;line-height:1.3}
.l3 .rc,.l4 .rc{color:#fff}
.hp .hh .src{margin-left:auto}
.hp .id{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));color:var(--faint)}
.pb{font-size:calc(14px * var(--fs));line-height:1.55}
.anc{color:var(--accent-ink);font-family:var(--f-mono);font-size:.92em}
.pb a,.rl a{color:var(--accent-ink);word-break:break-all}
.media{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.media a{display:block;line-height:0}
.media img{display:block;max-width:100%;max-height:240px;border-radius:6px;background:var(--sunk)}
.media img.yt{max-height:150px}
.rl{list-style:none;margin:8px 0 0;padding:6px 0 0 10px;border-top:1px dashed var(--line);display:grid;gap:3px}
.rl li{font-size:calc(13px * var(--fs));line-height:1.5;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 6px}
.rl li .tm{grid-row:1 / span 2;margin:0;padding-top:1px;font-size:calc(11px * var(--fs))}
.rl .x{font-family:var(--f-mono);font-size:calc(11px * var(--fs));font-weight:600;color:var(--accent-ink);margin-left:4px;white-space:nowrap}
.rl .nn{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));color:var(--faint);margin-left:4px;white-space:nowrap}
.rl .media img{max-height:130px}
.hp:not(.open) .rl li.more{display:none}
.hp .rmore{margin-top:4px;font-size:calc(12.5px * var(--fs))}
.ctx{font-size:calc(12.5px * var(--fs));color:var(--muted);border-left:2px solid var(--line);padding:1px 0 1px 8px;margin:0 0 5px;line-height:1.5}
.ctx > div + div{margin-top:3px}
/* ---- 話題をタップ → 元のレス ---- */
.tp[data-lg],.hl[data-lg]{cursor:pointer}
.tp[data-lg]{border-radius:4px}
.tp[data-lg]:hover,.hl[data-lg]:hover{background:var(--sunk)}
.go{font-size:calc(11.5px * var(--fs));font-weight:700;color:var(--accent-ink);white-space:nowrap;margin-left:4px}
.hl .hn .go{margin-left:auto}
body.lock{overflow:hidden}
.lv{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;background:rgba(8,10,18,.55)}
.lv[hidden]{display:none}
.lvp{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;background:var(--bg)}
.lvh{position:relative;display:grid;gap:3px;padding:10px 50px 8px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
.lvx{position:absolute;top:max(7px,env(safe-area-inset-top));right:9px;width:34px;height:34px;border:0;border-radius:50%;background:var(--sunk);font-size:calc(15px * var(--fs));line-height:1;cursor:pointer}
.lvm{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:calc(12.5px * var(--fs));color:var(--muted)}
.lvm b{font-family:var(--f-mono);color:var(--ink)}
.lvt{display:block;min-width:0;max-width:100%;border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:700;font-size:calc(15.5px * var(--fs));line-height:1.4;color:var(--ink);cursor:pointer}
.lvd{display:grid;gap:3px}
.lvrow .sep{flex:0 0 1px;align-self:stretch;background:var(--line);margin:3px 4px}
@media (max-width:759px){
  .lvh{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:6px;gap:2px}
  .lvt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lvt::after{content:" ▾";color:var(--accent-ink);font-size:.8em}
  .lvh:not(.more) .lvd{display:none}
  .lvh.more .lvt{white-space:normal}
  .lvh.more .lvt::after{content:" ▴"}
  .lvbar{padding:6px 12px;gap:4px}
  .lvb{padding:8px 10px 28px}
}
.lvs{margin:0;font-size:calc(13px * var(--fs));color:var(--muted)}
.lvh .hn{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:calc(11.5px * var(--fs));color:var(--accent-ink)}
.lvbar{display:grid;gap:5px;padding:7px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.lvrow{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.lvrow::-webkit-scrollbar{display:none}
.lvrow .lbl{flex:0 0 auto;font-size:calc(12px * var(--fs));color:var(--muted)}
.lvrow .hchip,.lvrow .link,.lvrow .imgsw{flex:0 0 auto}
.lvrow .hchip{padding:3px 9px;font-size:calc(12px * var(--fs))}
.lvrow .sp{flex:1}
.lvrow.wrap{flex-wrap:wrap;white-space:normal;overflow:visible;gap:4px 10px}
.lvb{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 14px 28px}
.lp{padding:6px 10px 7px;margin:0 0 6px}
.lp.n0{--heat:var(--line)}
.lp.hit{background:color-mix(in srgb, var(--accent-soft) 60%, var(--surface))}
.refb{font-size:calc(11px * var(--fs));font-weight:700;line-height:1.3;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent);border-radius:5px;padding:1px 6px}
.lvnote{margin:0 0 8px;font-size:calc(12.5px * var(--fs));color:var(--muted)}
.hchip[disabled]{opacity:.45;cursor:default}
.lp .ctx > div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thn{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));line-height:1.3;padding:1px 5px;border-radius:4px;background:hsl(var(--hue) 70% 55% / .22);color:var(--muted)}
.rcb{border:0;cursor:pointer;font-size:calc(12px * var(--fs));font-weight:700;line-height:1.3;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.l1 .rcb,.l2 .rcb{background:var(--heat);color:var(--heat-ink)}
.l3 .rcb,.l4 .rcb{background:var(--heat);color:#fff}
.rcb[aria-expanded="true"]{outline:2px solid var(--accent);outline-offset:1px}
.lvmark{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-size:calc(12px * var(--fs));font-weight:700;color:var(--accent-ink)}
.lvmark::before,.lvmark::after{content:"";flex:1;height:1px;background:var(--accent)}
.lvext{display:block;width:100%;margin:0 0 10px;padding:8px;border:1px dashed var(--faint);border-radius:8px;background:none;color:var(--accent-ink);font-weight:700;cursor:pointer}
.lvext + .lvext,.lvb > .lvext:last-child{margin:6px 0 0}
@media (min-width:760px){
  .lv{padding:3vh 16px}
  .lvp{max-width:900px;border-radius:12px;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.4)}
}
/* ---- 文字の大きさ・背景 ---- */
.dbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 9px;font-family:var(--f-body);font-weight:700;font-size:calc(14px * var(--fs));line-height:1.2;cursor:pointer}
.dbtn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.dsp{position:fixed;z-index:90;left:0;right:0;bottom:0;max-height:85vh;overflow-y:auto;background:var(--surface);color:var(--ink);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.3);padding:12px 16px max(14px,env(safe-area-inset-bottom));display:grid;gap:10px}
.dsp[hidden]{display:none}
.dsp h3{margin:0;font-size:calc(15px * var(--fs))}
.dsp .row{display:grid;gap:5px}
.dsp .lbl{font-size:calc(12.5px * var(--fs));color:var(--muted);font-weight:700}
.dsp .opts{display:flex;flex-wrap:wrap;gap:6px}
.dsp .hchip{padding:6px 12px;font-size:calc(13.5px * var(--fs))}
.dsp .sample{margin:0;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:calc(14px * var(--fs))}
.dsp .sample small{display:block;color:var(--muted);font-size:calc(12px * var(--fs))}
.dsp .end{justify-self:end}
@media (min-width:760px){
  .dsp{left:auto;right:14px;bottom:auto;top:58px;width:400px;border:1px solid var(--line);border-radius:12px}
}
.toast{position:fixed;z-index:95;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));margin:0 auto;max-width:520px;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.35);display:grid;gap:8px;font-size:calc(13.5px * var(--fs))}
.toast[hidden]{display:none}
.toast .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.toast button{border:0;border-radius:7px;padding:6px 11px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.toast button.sub{background:transparent;color:var(--bg);border:1px solid currentColor}
.toast input{width:100%;font:inherit;padding:5px 7px;border-radius:6px;border:0}
.lp{content-visibility:auto;contain-intrinsic-size:auto 96px}
.gh-only{display:none}
.is-gh .gh-only{display:inline-block}
.app-only{display:none}
.is-app .app-only{display:inline-block}

/* ---- 画面の広さごと ---- */
@media (min-width:760px){
  main{padding:12px 18px 28px}
  .cols{columns:320px;column-gap:10px}
  .dhead{grid-template-columns:minmax(0,1fr) minmax(200px,300px);align-items:end}
  .dhead .spark{grid-column:2;grid-row:1 / span 3}
  .tags{padding-inline:18px}
}
@media (min-width:1100px){
  .bar{position:sticky;top:0;z-index:20}
  .chips{display:none}
  .layout{display:grid;grid-template-columns:250px minmax(0,1fr)}
  .rail{display:block;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;border-right:1px solid var(--line);scrollbar-width:thin}
  main{padding:12px 22px 28px}
}
@media (min-width:1600px){
  .layout{grid-template-columns:280px minmax(0,1fr)}
  .cols{columns:340px}
}
@media (prefers-reduced-motion:no-preference){
  .ditem,.chip,.tag{transition:background-color .12s}
}
</style>
</head>
<body>
<header class="bar" id="bar">
  <h1 class="brand">なかよし板 見どころ帳</h1>
  <div class="stats" id="stats"></div>
  <div class="find">
    <input id="q" class="search" type="search" placeholder="ライバー名や話題で探す" aria-label="ライバー名や話題で探す" enterkeyhint="search">
    <button id="clear" class="link" hidden>クリア</button>
    <button id="reload" class="link app-only">最新にする</button>
    <button id="dispBtn" class="dbtn" aria-label="文字の大きさと背景" aria-expanded="false" aria-controls="disp">Aa</button>
  </div>
</header>
<p class="notice" id="notice" hidden></p>
<nav class="tags" id="tags" aria-label="よく出る名前"></nav>
<div class="layout">
  <nav class="chips" id="chips" aria-label="日付"></nav>
  <nav class="rail" id="rail" aria-label="日付"></nav>
  <main id="main"><p class="empty">読み込んでいます…</p></main>
</div>
<footer>
  <span>勢い＝10分あたりのレス数。要約はPCのLLMが書いたもので、事実確認はしていません。</span>
  <span>この掲示板は転載禁止です。自分の端末だけで見て、共有しないでください。</span>
  <button id="retoken" class="link gh-only">GitHubのトークンを入れ直す</button>
</footer>
<div class="dsp" id="disp" role="dialog" aria-label="文字の大きさと背景" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="lv" id="lv" hidden>
  <section class="lvp" role="dialog" aria-modal="true" aria-label="元のレス">
    <header class="lvh" id="lvh"></header>
    <div class="lvbar" id="lvbar"></div>
    <div class="lvb" id="lvb"></div>
  </section>
</div>
<script id="data" type="application/json">{"github": {"owner": "tk28-02", "repo": "midokoro-data"}}</script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const WD = ['日','月','火','水','木','金','土'];
  const fmtD = ds => { const [y,m,d] = ds.split('-').map(Number); return {md:`${m}/${d}`, w:WD[new Date(y, m-1, d).getDay()]}; };
  const lvl = v => v >= 500 ? 4 : v >= 350 ? 3 : v >= 250 ? 2 : 1;
  const man = n => n >= 10000 ? (n / 10000).toFixed(1) + '万' : n.toLocaleString();
  const TH = 'https://bbs.jpnkn.com/test/read.cgi/nijifunbbs/';
  const WEB = location.protocol === 'https:' || location.protocol === 'http:';
  const wide = () => matchMedia('(min-width:760px)').matches;
  // 元のレスへのリンク：Android では ChMate で開く（開けなかったら、このページに戻ってきて知らせる）
  const ANDROID = /Android/i.test(navigator.userAgent);
  const CHMATE = 'jp.co.airfront.android.a2chMate';
  function bbsLink(tid, no, label){
    const web = TH + tid + '/' + (no ? no + '-' : 'l50');
    // ChMate はこの掲示板のリンクを受け付けないので、Android ではタップでURLをコピーして ChMate に貼ってもらう
    return `<a href="${esc(web)}" target="_blank" rel="noopener"${ANDROID ? ` class="cm" data-bbs="${esc(tid + '/' + (no || ''))}"` : ''}>${label}</a>`;
  }

  // ---- データの読み込み（ページに埋め込み／日ごとのファイル） ----
  const NKD = window.NKD = {
    idx: null, days: {}, hots: {}, logs: {},
    index(x){ NKD.idx = x; },
    day(d){ NKD.days[d.date] = d; },
    hot(x){ NKD.hots[x.date] = x; },
    log(x){ NKD.logs[x.date + '/' + x.h] = x; }
  };
  function loadScript(src){
    return new Promise((ok, ng) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => { s.remove(); ok(); };
      s.onerror = () => { s.remove(); ng(new Error(src)); };
      document.head.appendChild(s);
    });
  }
  function nameCounts(d){
    const c = {};
    (d.highlights || []).forEach(h => (h.names || []).forEach(n => c[n] = (c[n] || 0) + 2));
    (d.timeline || []).forEach(w => (w.topics || []).forEach(t => (t.names || []).forEach(n => c[n] = (c[n] || 0) + 1)));
    return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 20);
  }
  let EMB = null;
  try { EMB = JSON.parse(document.getElementById('data').textContent); } catch (e) {}
  const LEGACY = !!(EMB && EMB.days);          // 古い形：全部の日がページに埋め込み
  const GH = EMB && EMB.github ? EMB.github : null;   // スマホ用：GitHub の非公開リポジトリから読む
  let token = '';
  try { token = localStorage.getItem('nkd-gh-token') || ''; } catch (e) {}
  async function ghJSON(path, v){
    const url = `${GH.api || 'https://api.github.com'}/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/contents/${path}` + (v ? `?v=${v}` : '');
    const r = await fetch(url, {headers: {Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.raw+json'}, cache: 'no-store'});
    if (!r.ok){ const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
    return r.json();
  }
  if (LEGACY) {
    NKD.idx = {built: EMB.built, fetched: EMB.fetched, blocked: EMB.blocked, pending: EMB.pending,
      days: EMB.days.map(d => ({date: d.date, posts: d.posts, peak: d.peak, headline: d.headline || '', pending: d.pending || 0,
        waiting: d.waiting || 0, partial: !!d.partial, hourly: d.hourly || [], v: 'emb', names: nameCounts(d)}))};
    EMB.days.forEach(d => NKD.days[d.date] = d);
  }
  let idx = null, byDate = {}, loadedV = {}, loadedH = {};
  async function loadHot(date){
    const di = byDate[date] || {};
    if (NKD.hots[date] && loadedH[date] === di.hv) return NKD.hots[date];
    if (LEGACY) return null;
    if (GH) NKD.hots[date] = await ghJSON(`data/hot/${date}.json`, di.hv);
    else await loadScript(`data/hot/${date}.js?v=${di.hv || Date.now()}`);
    loadedH[date] = di.hv;
    return NKD.hots[date] || null;
  }
  async function loadIndex(){
    if (GH) NKD.idx = await ghJSON('data/index.json');
    else if (!LEGACY) await loadScript('data/index.js?t=' + Date.now());
    idx = NKD.idx;
    byDate = Object.fromEntries((idx && idx.days || []).map(d => [d.date, d]));
  }
  async function loadDay(date){
    const di = byDate[date];
    if (NKD.days[date] && (LEGACY || loadedV[date] === di.v)) return NKD.days[date];
    if (GH) NKD.days[date] = await ghJSON(`data/days/${date}.json`, di.v);
    else await loadScript(`data/days/${date}.js?v=${di.v}`);
    loadedV[date] = di.v;
    return NKD.days[date];
  }
  async function loadAll(onStep){
    const list = idx.days.map(d => d.date); let n = 0, i = 0;
    async function worker(){ while (i < list.length){ const d = list[i++]; try { await loadDay(d); } catch (e) {} onStep(++n, list.length); } }
    await Promise.all([worker(), worker(), worker(), worker()]);
  }

  // ---- 状態 ----
  const state = {date: '', q: '', tag: '', open: null, tab: 'sum', hmin: 10, hsort: 'n', img: true};
  try {
    state.date = localStorage.getItem('nkd-date') || '';
    const v = JSON.parse(localStorage.getItem('nkd-view') || '{}');
    if (v.tab === 'hot') state.tab = 'hot';
    if ([5, 10, 20, 30].includes(v.hmin)) state.hmin = v.hmin;
    if (v.hsort === 't') state.hsort = 't';
    if (v.img === false) state.img = false;
  } catch (e) {}
  const save = () => { try {
    localStorage.setItem('nkd-date', state.date);
    localStorage.setItem('nkd-view', JSON.stringify({tab: state.tab, hmin: state.hmin, hsort: state.hsort, img: state.img}));
  } catch (e) {} };

  // ---- 上の帯・日付・名前 ----
  function renderChrome(offline){
    const days = idx.days, total = days.reduce((a, d) => a + (d.posts || 0), 0);
    const pend = idx.pending || 0;
    $('#stats').innerHTML =
      `<span>収録 <b>${fmtD(days[days.length - 1].date).md}〜${fmtD(days[0].date).md}</b></span>` +
      `<span><b>${days.length}</b>日分</span><span><b>${man(total)}</b>レス</span>` +
      (idx.fetched ? `<span>最終取得 <b>${esc(idx.fetched)}</b></span>` : '') +
      (pend ? `<span class="warn" title="PCを使っていない時間に少しずつ要約します">未要約 <b>${pend.toLocaleString()}</b>枠</span>` : '');
    const notes = [];
    if (offline) notes.push(GH ? 'ネットにつながらないので、前に読み込んだ内容を表示しています。' : 'PCにつながらないので、前に読み込んだ内容を表示しています。');
    if (idx.blocked) notes.push('掲示板にログの取得を断られています。しばらくしてから自動でやり直します。');
    $('#notice').textContent = notes.join(' ');
    $('#notice').hidden = !notes.length;
    const maxPeak = Math.max(1, ...days.map(d => d.peak || 0));
    $('#chips').innerHTML = days.map(d => { const f = fmtD(d.date);
      return `<button class="chip" data-date="${d.date}"><span class="d">${f.md}</span><span class="w">${f.w}</span><span class="hb"><i style="width:${Math.round((d.peak || 0) / maxPeak * 100)}%"></i></span></button>`; }).join('');
    $('#rail').innerHTML = days.map(d => { const f = fmtD(d.date);
      return `<button class="ditem" data-date="${d.date}"><span class="dl"><b>${f.md}</b><span>${f.w}</span><span>${man(d.posts || 0)}</span><span class="hb"><i style="width:${Math.round((d.peak || 0) / maxPeak * 100)}%"></i></span></span>` +
        `<span class="dh${d.headline ? '' : ' none'}">${d.headline ? esc(d.headline) : (d.pending ? `未要約（${d.pending}枠）` : 'まだ要約していません')}</span></button>`; }).join('');
    const tc = {};
    days.forEach(d => (d.names || []).forEach(([n, c]) => tc[n] = (tc[n] || 0) + c));
    $('#tags').innerHTML = Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 60)
      .map(([t, n]) => `<button class="tag" data-tag="${esc(t)}" aria-pressed="false">${esc(t)}<span class="n">${n}</span></button>`).join('');
  }
  function markCurrent(){
    const searching = !!(state.q || state.tag);
    document.querySelectorAll('.chip,.ditem').forEach(b => b.setAttribute('aria-current', String(!searching && b.dataset.date === state.date)));
    document.querySelectorAll('.tag').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tag === state.tag)));
    $('#clear').hidden = !searching;
    const c = document.querySelector(`.chip[data-date="${state.date}"]`);
    if (c && !searching) c.scrollIntoView({block: 'nearest', inline: 'center'});
    const r = document.querySelector(`.ditem[data-date="${state.date}"]`);
    if (r && !searching) r.scrollIntoView({block: 'nearest'});
  }

  // ---- 1日ぶん ----
  function heatAt(d, time){
    if (!time) return null;
    const w = (d.timeline || []).filter(c => c.start <= time && time < c.end);
    return w.length ? Math.max(...w.map(c => c.per10)) : null;
  }
  function srcAt(d, time){
    const w = (d.timeline || []).find(c => c.start <= time && time < c.end);
    return w && w.first ? w.first : null;
  }
  function spark(d){
    const h = d.hourly || [], mx = Math.max(...h, 1), W = 240, H = 36, bw = W / 24;
    const hot = new Set((d.highlights || []).map(x => parseInt(x.time, 10)));
    const bars = h.map((v, i) => { const bh = v ? Math.max(2, v / mx * (H - 4)) : 0;
      return `<rect x="${(i * bw + 0.8).toFixed(1)}" y="${(H - bh).toFixed(1)}" width="${(bw - 1.6).toFixed(1)}" height="${bh.toFixed(1)}" rx="1" fill="var(${hot.has(i) ? '--bar-hot' : '--bar'})"></rect>`; }).join('');
    return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="時間帯ごとのレス数。いちばん多い1時間は${mx}レス">${bars}</svg><div class="ax"><span>0時</span><span>6</span><span>12</span><span>18</span><span>24時</span></div></div>`;
  }
  function hi(s, q){
    let t = esc(s);
    if (q){ const r = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); t = t.replace(r, m => `<mark>${m}</mark>`); }
    return t;
  }
  const heatTag = v => `<span class="heat l${lvl(v)}" title="10分あたり${v}レス">${v}<small>/10分</small></span>`;
  function hlCard(h, d, q){
    const v = heatAt(d, h.time), s = srcAt(d, h.time), at = lgAttr(d, h);
    return `<li class="hl l${lvl(v || 0)}"${at}><div class="ht"><span class="tm">${esc(h.time)}</span>${v ? heatTag(v) : ''}</div>` +
      `<b>${hi(h.title, q)}</b><p>${hi(h.summary, q)}</p>` +
      `<div class="hn">${(h.names || []).map(t => `<span>#${esc(t)}</span>`).join('')}${s ? `<span class="src">${bbsLink(s.tid, s.no, `&gt;&gt;${s.no}〜`)}</span>` : ''}${at ? '<span class="go">元レス ›</span>' : ''}</div></li>`;
  }
  const topicLine = (t, q, at) => `<p class="tp"${at || ''}><span class="tm">${esc(t.time)}</span><b>${hi(t.title, q)}</b> <span class="sm">${hi(t.summary, q)}</span>${at ? '<span class="go">元レス ›</span>' : ''}</p>`;
  function dayHTML(d){
    const f = fmtD(d.date), hours = (d.hourly || []).map((v, i) => v ? i : null).filter(v => v != null);
    const notes = [];
    if (d.partial && hours.length) notes.push(`この日は手元のログが ${hours[0]}時〜${hours[hours.length - 1]}時台 だけです。`);
    if (d.pending) notes.push(`まだ要約していない時間帯が ${d.pending} 枠あります。`);
    if (d.waiting) notes.push(`進行中の ${d.waiting} 枠は、区切りが終わってから要約します。`);
    let h = `<header class="dhead">` +
      `<div class="dmeta"><span><b>${d.date.replace(/-/g, '.')}</b>（${f.w}）</span><span><b>${(d.posts || 0).toLocaleString()}</b>レス</span><span>ピーク <b>${d.peak || 0}</b>/10分</span></div>` +
      (d.headline ? `<h2>${esc(d.headline)}</h2>` : `<h2 class="none">まだ要約していません。PCを使っていない時間に進めます。</h2>`) +
      (notes.length ? `<p class="dnote">${notes.join(' ')}</p>` : '') + spark(d) + `</header>`;
    return h;
  }
  function tabsHTML(d){
    const di = byDate[d.date] || {}, n = di.hot ? di.hot[0] : null;
    return `<div class="tabs" role="tablist"><button class="tabb" role="tab" data-tab="sum" aria-selected="${state.tab !== 'hot'}">まとめ</button>` +
      `<button class="tabb" role="tab" data-tab="hot" aria-selected="${state.tab === 'hot'}">伸びたレス${n != null ? `<span class="c">${n}</span>` : ''}</button></div>`;
  }
  function sumHTML(d){
    let h = ''; LGREG.length = 0;
    if ((d.highlights || []).length)
      h += `<section class="sec"><h3 class="sh">見どころ<span class="c">${d.highlights.length}件</span></h3><ol class="hlg">${d.highlights.map(x => hlCard(x, d)).join('')}</ol></section>`;
    if ((d.timeline || []).length){
      const groups = {}; d.timeline.forEach(c => (groups[c.start] = groups[c.start] || []).push(c));
      const entries = Object.entries(groups);
      const nTopics = d.timeline.reduce((a, c) => a + (c.topics || []).length, 0);
      const open = state.open == null ? wide() : state.open;
      h += `<section class="sec"><h3 class="sh">時間帯ごと<span class="c">${entries.length}枠・${nTopics}話題</span><button class="link" data-act="toggle">${open ? 'すべてたたむ' : 'すべて開く'}</button></h3><div class="cols">` +
        entries.map(([st, cs]) => {
          const tps = cs.flatMap(c => (c.topics || []).map(t => [t, c])), v = Math.max(...cs.map(c => c.per10 || 0)), first = cs[0].first;
          return `<details class="win l${lvl(v)}"${open ? ' open' : ''}><summary><span class="wt">${st}</span>${heatTag(v)}<span class="pv">${esc(tps.slice(0, 2).map(x => x[0].title).join(' / '))}</span><span class="n">${tps.length}</span></summary>` +
            `<div class="tps">${tps.map(([t, c]) => topicLine(t, '', lgAttr(d, t, c))).join('')}${first ? `<div class="src">${bbsLink(first.tid, first.no, `スレの &gt;&gt;${first.no}〜`)}</div>` : ''}</div></details>`;

  function showSetup(msg){
    const u = 'https://github.com/settings/personal-access-tokens/new?' + new URLSearchParams({
      name: 'midokoro-phone', description: '見どころ帳アプリ用（読み取りのみ）', expires_in: 'none', contents: 'read'});
    ['#stats', '#tags', '#chips', '#rail'].forEach(s => $(s).innerHTML = '');
    $('#main').innerHTML = `<section class="setup"><h2>スマホで見る準備（最初の1回だけ）</h2>
      <p>PCが作った要約は、GitHubの非公開リポジトリ <b>${esc(GH.owner)}/${esc(GH.repo)}</b> に置いてあります。読むための「トークン」を一度だけ入れてください。</p>
      <ol><li><a href="${u}" target="_blank" rel="noopener">GitHubでトークンを作る画面を開く</a></li>
      <li>「Repository access」で「Only select repositories」を選び、<b>${esc(GH.repo)}</b> を選ぶ</li>
      <li>いちばん下の「Generate token」を押して、出てきた文字列をコピーする</li>
      <li>下に貼り付けて「保存」を押す</li></ol>
      <div class="row"><input id="tok" class="search" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="トークン"><button id="tokSave" class="btn">保存</button></div>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
      <p class="small">このトークンでできるのは ${esc(GH.repo)} を読むことだけです。いらなくなったら GitHub の設定から消せます。</p></section>`;
    $('#tokSave').addEventListener('click', () => {
      const v = $('#tok').value.trim(); if (!v) return;
      try { localStorage.setItem('nkd-gh-token', v); } catch (e) {}
      location.reload();
    });
  }
  if (GH){
    document.body.classList.add('is-gh');
    $('#retoken').addEventListener('click', () => { try { localStorage.removeItem('nkd-gh-token'); } catch (e) {} token = ''; showSetup(); window.scrollTo(0, 0); });
  }

  // ---- はじめ ----
  (async () => {
    if (GH && !token){ showSetup(); return; }
    try { await loadIndex(); }
    catch (e) {
      if (GH && (e.status === 401 || e.status === 403)){ showSetup('トークンが正しくないか、期限が切れています。作り直して貼り付けてください。'); return; }
      if (GH && e.status === 404){ showSetup(`${GH.repo} を読めませんでした。トークンを作るときに ${GH.repo} を選んだか確かめてください。`); return; }
      $('#main').innerHTML = GH ? '<p class="empty">データを読み込めませんでした。電波のよいところで、もう一度開いてください。</p>'
                                : '<p class="empty">データを読み込めませんでした。PCで「要約する.bat」を一度実行してください。</p>';
      return;
    }
    if (!idx || !idx.days || !idx.days.length){ $('#main').innerHTML = '<p class="empty">まだ要約した日がありません。PCで「要約する.bat」を実行するか、自動更新を待ってください。</p>'; return; }
    if (!byDate[state.date]) state.date = idx.days[0].date;
    renderChrome(!(await netStatus()));
    render(false);
  })();
})();
</script>
</body>
</html>
